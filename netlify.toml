[build]
  command = "npm run build"
  publish = "dist_site"

[[redirects]]
  from = "/api/*"
  to = "https://agriguardian-backend-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/login/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/employee/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/portals"
  to = "/app.html"
  status = 200
